<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お気に入りリスト</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>お気に入り</h1>
    <p>配列に入れたものを表示しています。</p>
    <ul id="favorite-list"></ul>
    <p><a href="index.html">戻る</a></p>

    <script>
        const me = {
            name: "笠松瑛太",
            favoriteColor: "赤",
            hobby: "読書"
        };

        console.log(me.name);          // "笠松瑛太"
        console.log(me.favoriteColor); // "赤"
        console.log(me.hobby);         // "読書"

        const favorites = [
            { category: "好きな食べ物", value: "寿司", reason: "魚が好きだから" },
            { category: "好きな色", value: "赤", reason: "かっこいい色だから" },
            { category: "好きな音楽", value: "漫画", reason: "おもしろいから" },
            { category: "好きな場所", value: "図書館", reason: "静かで集中できるから" }
        ];
        const ul = document.getElementById("favorite-list");
        for (let i = 0; i < favorites.length; i++) {
            const li = document.createElement("li");
            li.textContent = `${favorites[i].category}：${favorites[i].value}（${favorites[i].reason}）`;
            ul.appendChild(li);
        }
    </script>
</body>

</html>
