<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レイアウトの練習</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 16px; }
    .card { padding: 16px; background: #e8f0fe; border: 2px solid #3d5a73; border-radius: 8px; }
        .tags { display: flex; gap: 8px; }
    .tag { padding: 4px 12px; background: #fde8d0; border-radius: 16px; }
     .holes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
     .hole { aspect-ratio: 1 / 1; border-radius: 50%; background: #ddd; }
    .bar{padding: 12px 16px; background: #3d5a73;color: white;}
 </style>
</head>
<body>
  <h2>カードを並べる</h2>
  <div class="cards">
    <div class="card">1</div>
    <div class="card">2</div>
    <div class="card">3</div>
    <div class="card">4</div>
  </div>
    <h2>タグを並べる</h2>
  <div class="tags">
    <span class="tag">マグ</span>
    <span class="tag">ノート</span>
    <span class="tag">ペン</span>
    <span class="tag">ふせん</span>
    <span class="tag">ハサミ</span>
    <span class="tag">定規</span>
    <span class="tag">消しゴム</span>
  </div>
  <br>
<div class="bar">
  <span>もぐらたたき</span>
  <span>スコア: 3</span>
</div>
  <h2>穴を格子に並べる</h2>
  <div class="holes">
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
  </div>
</body>
</html>
